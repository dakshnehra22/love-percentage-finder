<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Calculator Pro ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff0844,#ff4f81,#ff6a88,#ff99ac);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:450px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
    text-align:center;
    color:white;
}

.logo{
    font-size:70px;
    animation:heart 1.5s infinite;
}

@keyframes heart{
    50%{
        transform:scale(1.15);
    }
}

h1{
    margin-top:10px;
    margin-bottom:25px;
    font-size:2rem;
}

.input-box{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:white;
    color:#ff2e63;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

.result{
    margin-top:25px;
    font-size:32px;
    font-weight:700;
}

.message{
    margin-top:10px;
    font-size:18px;
}

.progress{
    margin-top:20px;
    width:100%;
    height:18px;
    background:rgba(255,255,255,0.3);
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:white;
    transition:1s;
}

.footer{
    margin-top:20px;
    font-size:13px;
    opacity:.8;
}

</style>
</head>
<body>

<div class="container">

<div class="logo">❤️</div>

<h1>Love Calculator Pro</h1>

<div class="input-box">
<input type="text" id="name1" placeholder="Enter First Name">
</div>

<div class="input-box">
<input type="text" id="name2" placeholder="Enter Second Name">
</div>

<button onclick="calculateLove()">
Calculate Love 💘
</button>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div class="result" id="result"></div>
<div class="message" id="message"></div>

<div class="footer">
Made with ❤️
</div>

</div>

<script>

function calculateLove(){

let n1=document.getElementById("name1").value.trim().toLowerCase();
let n2=document.getElementById("name2").value.trim().toLowerCase();

if(n1==="" || n2===""){
document.getElementById("result").innerHTML="⚠️";
document.getElementById("message").innerHTML="Enter both names";
return;
}

let percent;

// Special Names
if(
(n1==="daksh" && n2==="nikita") ||
(n1==="nikita" && n2==="daksh") ||
(n1==="daksh" && n2==="anaaya") ||
(n1==="anaaya" && n2==="daksh")
){
percent=100;
}
else{

let total=0;

for(let i=0;i<n1.length;i++){
total+=n1.charCodeAt(i);
}

for(let i=0;i<n2.length;i++){
total+=n2.charCodeAt(i);
}

percent=(total%51)+50;

}

document.getElementById("bar").style.width=percent+"%";
document.getElementById("result").innerHTML=percent+"% ❤️";

let msg="";

if(percent>=95){
msg="Soulmate Level Match 💍";
}
else if(percent>=85){
msg="Perfect Couple ❤️";
}
else if(percent>=70){
msg="Strong Connection 💖";
}
else{
msg="Good Friendship 😊";
}

document.getElementById("message").innerHTML=msg;

}

</script>

</body>
</html>
