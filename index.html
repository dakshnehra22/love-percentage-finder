<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Calculator ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0a0a0a;
}

.container{
    width:400px;
    padding:30px;
    text-align:center;
    background:#111;
    border-radius:20px;
    box-shadow:0 0 25px rgba(255,0,100,0.4);
}

h1{
    color:#ff4d88;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff1f6b;
}

#result{
    margin-top:20px;
    font-size:35px;
    color:white;
    font-weight:bold;
}

#message{
    margin-top:10px;
    color:#ff4d88;
    font-size:18px;
}
</style>
</head>
<body>

<div class="container">
    <h1>❤️ Love Calculator ❤️</h1>

    <input type="text" id="name1" placeholder="First Name">

    <input type="text" id="name2" placeholder="Second Name">

    <button onclick="calculateLove()">
        Calculate Love
    </button>

    <div id="result"></div>
    <div id="message"></div>
</div>

<script>

function calculateLove(){

let n1=document.getElementById("name1").value.trim().toLowerCase();
let n2=document.getElementById("name2").value.trim().toLowerCase();

if(n1==="" || n2===""){
    document.getElementById("result").innerHTML="⚠️";
    document.getElementById("message").innerHTML="Enter both names";
    return;
}

let percent;

// Special Names
if(
(n1==="daksh" && n2==="nikita") ||
(n1==="nikita" && n2==="daksh") ||
(n1==="daksh" && n2==="anaaya") ||
(n1==="anaaya" && n2==="daksh")
){
    percent=100;
}
else{
    percent=Math.floor(Math.random()*41)+60;
}

document.getElementById("result").innerHTML=percent+"% ❤️";

if(percent===100){
    document.getElementById("message").innerHTML="Soulmate Forever 💍";
}
else if(percent>=90){
    document.getElementById("message").innerHTML="Perfect Couple 💖";
}
else if(percent>=75){
    document.getElementById("message").innerHTML="Strong Connection ❤️";
}
else{
    document.getElementById("message").innerHTML="Good Friendship 😊";
}

}

</script>

</body>
</html>
