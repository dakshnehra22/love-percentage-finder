<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Calculator Pro ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#000000,#0f172a,#1e293b);
    overflow:hidden;
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 8s linear infinite;
    opacity:.4;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
    }
    100%{
        transform:translateY(-100px);
    }
}

.container{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,0,100,.3);
}

.logo{
    font-size:70px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.15);
    }
}

h1{
    color:white;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-box{
    width:320px;
    background:#111827;
    padding:30px;
    border-radius:25px;
    text-align:center;
    color:white;
    box-shadow:0 0 40px #ff4d88;
    animation:popup .5s ease;
}

@keyframes popup{
    0%{
        transform:scale(.3) rotate(-10deg);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

.percent{
    font-size:65px;
    font-weight:bold;
    color:#ff4d88;
}

.message{
    margin-top:10px;
    font-size:20px;
}

.close{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#ff4d88;
    color:white;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="heart" style="left:10%;font-size:25px;">❤️</div>
<div class="heart" style="left:30%;font-size:40px;animation-duration:10s;">❤️</div>
<div class="heart" style="left:60%;font-size:30px;animation-duration:7s;">❤️</div>
<div class="heart" style="left:80%;font-size:50px;animation-duration:12s;">❤️</div>

<div class="container">

<div class="logo">❤️</div>

<h1>Love Calculator Pro</h1>

<input type="text" id="name1" placeholder="Enter First Name">

<input type="text" id="name2" placeholder="Enter Second Name">

<button onclick="calculateLove()">
Calculate Love 💘
</button>

</div>

<div class="popup" id="popup">
    <div class="popup-box">
        <div class="percent" id="percent">100%</div>
        <div class="message" id="message">Soulmate Forever 💍</div>
        <button class="close" onclick="closePopup()">Close</button>
    </div>
</div>

<script>

function calculateLove(){

let n1=document.getElementById("name1").value.trim().toLowerCase();
let n2=document.getElementById("name2").value.trim().toLowerCase();

if(n1==="" || n2===""){
    alert("Enter both names");
    return;
}

let percent;

// Special Pairs
if(
(n1==="daksh" && n2==="nikita") ||
(n1==="nikita" && n2==="daksh") ||
(n1==="daksh" && n2==="anaaya") ||
(n1==="anaaya" && n2==="daksh")
){
    percent=100;
}
else{
    percent=Math.floor(Math.random()*41)+60;
}

let text="";

if(percent===100){
    text="Soulmate Forever 💍";
}
else if(percent>=90){
    text="Perfect Couple ❤️";
}
else if(percent>=75){
    text="Strong Connection 💖";
}
else{
    text="Good Friendship 😊";
}

document.getElementById("percent").innerHTML=percent+"% ❤️";
document.getElementById("message").innerHTML=text;

document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
